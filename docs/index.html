<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>포모도로 타이머</title>
<meta name="description" content="집중·휴식 시간을 직접 설정하고 할 일까지 관리하는 무료 포모도로 타이머. 설치 없이 브라우저에서 바로 사용하세요.">
<meta name="theme-color" content="#0d0f14">
<meta property="og:title" content="포모도로 타이머">
<meta property="og:description" content="집중·휴식 시간을 직접 설정하고 할 일까지 관리하는 무료 포모도로 타이머.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='24' fill='%23ff6b6b'/%3E%3Cpath d='M32 14c-2-6-8-8-12-6 4 0 6 3 7 7z' fill='%2334d399'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f3f4f8;--card:rgba(255,255,255,.85);--card-2:rgba(20,24,40,.06);--line:rgba(20,24,40,.08);
  --text:#14171f;--muted:#6a7282;--track:rgba(20,24,40,.08);--shadow:0 20px 50px rgba(30,40,80,.10);
  --font:"Segoe UI Variable Display","Segoe UI","Malgun Gothic",system-ui,sans-serif;
}
:root[data-theme=dark]{
  color-scheme:dark;
  --bg:#0d0f14; --card:rgba(255,255,255,.045); --card-2:rgba(255,255,255,.08); --line:rgba(255,255,255,.09);
  --text:#f2f4f8; --muted:#8e96a5; --track:rgba(255,255,255,.08); --shadow:0 20px 50px rgba(0,0,0,.35);
}
body[data-phase=focus]{--accent:#ff6b6b;--accent2:#ff9f6b}
body[data-phase=short]{--accent:#2fd4a0;--accent2:#5ee0e6}
body[data-phase=long]{--accent:#7c8cff;--accent2:#b18cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--text);padding:28px;min-height:100%;
  background:
    radial-gradient(900px 520px at 12% -8%,color-mix(in srgb,var(--accent) 24%,transparent),transparent 62%),
    radial-gradient(700px 500px at 100% 105%,color-mix(in srgb,var(--accent2) 16%,transparent),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
.app{max-width:1060px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:820px){.app{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:26px;box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.col{display:flex;flex-direction:column;gap:20px}
h2{font-size:15px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
h2 small{font-weight:500;color:var(--muted);font-size:13px}

/* ----- 타이머 ----- */
.timer{display:flex;flex-direction:column;align-items:center;gap:22px}
.pills{display:flex;gap:6px;padding:5px;background:var(--card-2);border-radius:999px}
.pill{padding:8px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted);transition:.3s}
.pill.on{color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 45%,transparent)}
.ring{position:relative;width:min(320px,100%);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--track)}
.ring .prog{stroke:url(#g);transition:stroke-dashoffset .3s linear;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--accent) 55%,transparent))}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
#time{font-size:clamp(54px,9vw,78px);font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
#sub{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;max-width:220px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--track);transition:.3s}
.dot.done{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.dot.now{background:var(--accent);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent)}}
.controls{display:flex;align-items:center;gap:18px}
.btn-round{width:52px;height:52px;border-radius:50%;border:1px solid var(--line);background:var(--card-2);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.2s}
.btn-round:hover{transform:translateY(-2px);background:color-mix(in srgb,var(--card-2) 60%,var(--accent) 14%)}
.btn-round svg{width:22px;height:22px;fill:currentColor}
.play{width:78px;height:78px;border:0;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 12px 30px color-mix(in srgb,var(--accent) 50%,transparent)}
.play:hover{transform:translateY(-2px) scale(1.04);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.play svg{width:32px;height:32px}
.live{display:flex;gap:10px;width:100%}
.live div{flex:1;background:var(--card-2);border-radius:16px;padding:12px 14px}
.live span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.live b{font-size:17px;font-variant-numeric:tabular-nums}
.end{width:100%;padding:14px;border-radius:16px;border:1px solid var(--line);background:transparent;color:var(--text);font:600 14px var(--font);cursor:pointer;transition:.2s}
.end:hover{background:var(--card-2);border-color:var(--accent)}

/* ----- 플래너 ----- */
.add{display:flex;gap:8px;margin-bottom:14px}
input[type=text]{flex:1;min-width:0;padding:13px 16px;border-radius:14px;border:1px solid var(--line);background:var(--card-2);color:var(--text);font:14px var(--font);outline:none;transition:.2s}
input[type=text]:focus{border-color:var(--accent)}
.add button{padding:0 18px;border-radius:14px;border:0;font:600 14px var(--font);color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.bar{height:5px;border-radius:3px;background:var(--track);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
#tasks{list-style:none;padding:0;max-height:280px;overflow:auto;display:flex;flex-direction:column;gap:6px}
#tasks li{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;background:var(--card-2);animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.chk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--muted);background:transparent;cursor:pointer;display:grid;place-items:center;transition:.2s;padding:0}
.chk svg{width:13px;height:13px;stroke:#fff;stroke-width:3;fill:none;opacity:0;transition:.2s}
.done .chk{border-color:transparent;background:linear-gradient(135deg,var(--accent),var(--accent2))}
.done .chk svg{opacity:1}
#tasks span{flex:1;font-size:14px;word-break:break-all;transition:.2s}
.done span{color:var(--muted);text-decoration:line-through}
.x{border:0;background:none;color:var(--muted);cursor:pointer;font-size:16px;opacity:0;transition:.2s}
li:hover .x{opacity:1}.x:hover{color:var(--accent)}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:22px 0}

/* ----- 설정 ----- */
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;font-size:14px}
.row+.row{border-top:1px solid var(--line)}
.step{display:flex;align-items:center;gap:4px;background:var(--card-2);border-radius:12px;padding:3px}
.step button{width:30px;height:30px;border:0;border-radius:9px;background:transparent;color:var(--text);font-size:17px;cursor:pointer}
.step button:hover{background:var(--card-2)}
.step input{width:44px;text-align:center;border:0;background:transparent;color:var(--text);font:600 14px var(--font);outline:none;-moz-appearance:textfield}
.step input::-webkit-inner-spin-button{display:none}
.step em{font-style:normal;color:var(--muted);font-size:12px;width:44px;padding-right:6px}
.sw{position:relative;width:44px;height:26px}
.sw input{position:absolute;inset:0;opacity:0;cursor:pointer;margin:0}
.sw i{position:absolute;inset:0;border-radius:999px;background:var(--track);transition:.25s;pointer-events:none}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}
.sw input:checked+i{background:linear-gradient(135deg,var(--accent),var(--accent2))}
.sw input:checked+i::after{transform:translateX(18px)}

/* ----- 집중 중: 설정 접기 · 명언 ----- */
.fold{display:grid;grid-template-rows:1fr;transition:grid-template-rows .45s ease,opacity .35s ease,margin .45s ease}
.fold>.in{overflow:hidden;overflow:clip;overflow-clip-margin:36px;min-height:0}
body[data-focusing=on] .fold.settings{grid-template-rows:0fr;opacity:0;margin-bottom:-20px;pointer-events:none}
.fold.quote{grid-template-rows:0fr;opacity:0;margin-bottom:-20px;pointer-events:none}
body[data-focusing=on] .fold.quote{grid-template-rows:1fr;opacity:1;margin-bottom:0;pointer-events:auto}
.quote .card{text-align:center;padding:38px 30px}
.quote q{display:block;quotes:none;font-size:20px;line-height:1.7;font-weight:600;word-break:keep-all}
.quote cite{display:block;margin-top:16px;font-style:normal;font-size:13px;color:var(--muted)}
.quote .mark{font-size:38px;line-height:1;color:var(--accent);margin-bottom:6px}

/* ----- 알림음 볼륨 · 테마 전환 ----- */
.row.vol{flex-wrap:wrap;gap:8px}
.volctl{display:flex;align-items:center;gap:8px}
.volctl input[type=range]{width:110px;accent-color:var(--accent);cursor:pointer}
.volctl output{min-width:38px;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.mini{padding:7px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card-2);color:var(--text);font:600 12px var(--font);cursor:pointer;transition:.2s}
.mini:hover{border-color:var(--accent)}
.timer{position:relative}
.theme-btn{position:absolute;top:22px;right:22px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card-2);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:.2s;padding:0}
.theme-btn:hover{transform:translateY(-1px);border-color:var(--accent)}
.theme-btn svg{width:18px;height:18px;fill:currentColor}
:root:not([data-theme=dark]) .big .f b{color:#e5484d}
:root:not([data-theme=dark]) .big .r b{color:#12a37f}

/* ----- 토스트 · 통계 ----- */
#toast{position:fixed;top:22px;left:50%;transform:translate(-50%,-90px);padding:13px 22px;border-radius:999px;background:var(--text);color:var(--bg);font-weight:600;font-size:14px;transition:.4s;box-shadow:var(--shadow)}
#toast.show{transform:translate(-50%,0)}
dialog{margin:auto;border:1px solid var(--line);border-radius:28px;padding:30px;width:min(420px,92vw);background:var(--bg);color:var(--text);box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(5,6,10,.6);backdrop-filter:blur(6px)}
dialog h3{font-size:20px;margin-bottom:4px}
dialog p{color:var(--muted);font-size:13px;margin-bottom:22px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.big div{border-radius:18px;padding:16px;background:var(--card-2)}
.big span{font-size:12px;color:var(--muted)}
.big b{display:block;font-size:22px;margin-top:4px;font-variant-numeric:tabular-nums}
.big .f b{color:#ff8a8a}.big .r b{color:#4fe0b4}
.split{height:10px;border-radius:5px;overflow:hidden;display:flex;background:var(--track);margin-bottom:16px}
.split i{display:block;height:100%}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:6px 0;color:var(--muted)}
.sum b{color:var(--text)}
.acts{display:flex;gap:10px;margin-top:20px}
.acts button{flex:1;padding:14px;border-radius:14px;font:600 14px var(--font);cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--text)}
.acts .pri{border:0;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2))}
</style>
<script>try{var __c=JSON.parse(localStorage.getItem('pomo-cfg'));if(__c&&__c.theme==='dark')document.documentElement.dataset.theme='dark'}catch(e){}</script>
</head>
<body data-phase="focus">
<div class="app">
  <section class="card timer">
    <button class="theme-btn" id="themeBtn" type="button"></button>
    <div class="pills" id="pills">
      <div class="pill" data-p="focus">집중</div><div class="pill" data-p="short">짧은 휴식</div><div class="pill" data-p="long">긴 휴식</div>
    </div>
    <div class="ring">
      <svg viewBox="0 0 300 300">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
        <circle class="track" cx="150" cy="150" r="132" fill="none" stroke-width="12"/>
        <circle class="prog" id="prog" cx="150" cy="150" r="132" fill="none" stroke-width="12" stroke-linecap="round"/>
      </svg>
      <div class="center"><div id="time">25:00</div><div id="sub"></div></div>
    </div>
    <div class="dots" id="dots"></div>
    <div class="controls">
      <button class="btn-round" id="reset" title="현재 단계 초기화"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6.5 12 11V8a5 5 0 1 1-5 5H5a7 7 0 1 0 7-8z"/></svg></button>
      <button class="btn-round play" id="start" title="시작 / 일시정지 (Space)"></button>
      <button class="btn-round" id="skip" title="건너뛰기"><svg viewBox="0 0 24 24"><path d="M6 5l9 7-9 7zM17 5h2v14h-2z"/></svg></button>
    </div>
    <div class="live">
      <div><span>오늘 집중</span><b id="lf">0분</b></div>
      <div><span>오늘 휴식</span><b id="lr">0분</b></div>
    </div>
    <button class="end" id="end">공부 세션 종료</button>
  </section>

  <div class="col">
    <section class="card">
      <h2>플래너 <small id="cnt"></small></h2>
      <form class="add" id="add"><input type="text" id="newTask" placeholder="오늘 할 일을 입력하세요" maxlength="100" autocomplete="off"><button>추가</button></form>
      <div class="bar"><i id="tbar"></i></div>
      <ul id="tasks"></ul>
    </section>
    <div class="fold settings"><div class="in">
      <section class="card">
        <h2>설정</h2>
        <div id="settings"></div>
        <div class="row"><span>다음 단계 자동 시작</span><label class="sw"><input type="checkbox" id="auto"><i></i></label></div>
        <div class="row"><span>종료 알림음</span><label class="sw"><input type="checkbox" id="sound"><i></i></label></div>
        <div class="row vol"><span>알림음 볼륨</span>
          <div class="volctl"><input type="range" id="vol" min="0" max="100" step="1" aria-label="알림음 볼륨"><output id="volv"></output>
            <button type="button" class="mini" id="tf">집중음</button><button type="button" class="mini" id="tr">휴식음</button></div></div>
      </section>
    </div></div>
    <div class="fold quote" aria-live="polite"><div class="in">
      <section class="card">
        <div class="mark">“</div>
        <q id="qText"></q>
        <cite id="qBy"></cite>
      </section>
    </div></div>
  </div>
</div>

<div id="toast"></div>

<dialog id="stats">
  <h3>수고하셨어요 🎉</h3>
  <p>이번 공부 세션의 기록입니다.</p>
  <div class="big"><div class="f"><span>총 집중 시간</span><b id="sFocus"></b></div><div class="r"><span>총 휴식 시간</span><b id="sRest"></b></div></div>
  <div class="split"><i id="spF" style="background:#ff6b6b"></i><i id="spR" style="background:#2fd4a0"></i></div>
  <div class="sum"><span>완료한 사이클</span><b id="sCycles"></b></div>
  <div class="sum"><span>완료한 할 일</span><b id="sTasks"></b></div>
  <div class="acts"><button id="keep">계속 공부하기</button><button class="pri" id="fresh">새 세션 시작</button></div>
</dialog>

<script>
const $ = id => document.getElementById(id);
const ld = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } };
const sv = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

const cfg = Object.assign({focus:25, short:5, long:15, cycles:4, auto:true, sound:true, volume:70, theme:'light'}, ld('pomo-cfg', {}));
let tasks = ld('pomo-tasks', []);
const s = {phase:'focus', cycle:0, running:false, last:0, remaining:0,
           stat:Object.assign({focus:0, rest:0, cycles:0}, ld('pomo-stat', {}))};

const NAMES = {focus:'집중', short:'짧은 휴식', long:'긴 휴식'};
const CIRC = 2 * Math.PI * 132;
const total = p => cfg[p] * 60;
s.remaining = total('focus');

const dur = sec => { sec = Math.round(sec); const h = Math.floor(sec/3600), m = Math.floor(sec%3600/60), x = sec%60;
  return h ? `${h}시간 ${m}분` : m ? `${m}분 ${x}초` : `${x}초`; };
const durShort = sec => { const m = Math.floor(sec/60); return m >= 60 ? `${Math.floor(m/60)}시간 ${m%60}분` : `${m}분`; };

function nextPhase() {
  if (s.phase !== 'focus') return 'focus';
  return s.cycle + 1 >= cfg.cycles ? 'long' : 'short';
}

/* ---------- 화면 ---------- */
const PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
const PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';

function render() {
  const t = Math.max(0, Math.ceil(s.remaining));
  const txt = `${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`;
  document.body.dataset.phase = s.phase;
  const focusing = s.running && s.phase === 'focus';
  if (focusing && document.body.dataset.focusing !== 'on') newQuote();
  document.body.dataset.focusing = focusing ? 'on' : 'off';
  $('time').textContent = txt;
  $('sub').textContent = `다음 · ${NAMES[nextPhase()]}`;
  $('prog').style.strokeDasharray = CIRC;
  $('prog').style.strokeDashoffset = CIRC * (1 - Math.max(0, s.remaining) / total(s.phase));
  $('start').innerHTML = s.running ? PAUSE : PLAY;
  document.querySelectorAll('.pill').forEach(p => p.classList.toggle('on', p.dataset.p === s.phase));
  const n = Math.min(cfg.cycles, 12);
  $('dots').innerHTML = Array.from({length:n}, (_, i) =>
    `<span class="dot ${s.phase === 'long' || i < s.cycle ? 'done' : (i === s.cycle && s.phase === 'focus' ? 'now' : '')}"></span>`).join('');
  $('lf').textContent = durShort(s.stat.focus);
  $('lr').textContent = durShort(s.stat.rest);
  document.title = `${txt} · ${NAMES[s.phase]}`;
}

/* ---------- 타이머 ---------- */
/* 집중 시작: 비행기 '안전벨트 착용' 사인처럼 맑은 종소리 한 번(ding)
   휴식 시작: 낮고 부드럽게 내려가는 2음 */
const AC = window.AudioContext || window.webkitAudioContext;
let ac;
function partial(ctx, dest, f, t, len, peak, attack) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(.0001, t);
  g.gain.exponentialRampToValueAtTime(Math.max(peak, .0002), t + attack);
  g.gain.exponentialRampToValueAtTime(.0001, t + len);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + len + .05);
}
function scheduleSound(ctx, dest, kind, vol, t0 = 0) {
  const v = Math.max(0, Math.min(100, vol)) / 100 * .9;
  if (v <= 0) return;
  if (kind === 'focus') {
    // 종소리: 기음 + 옥타브·3배음이 길게 울리며 사라짐
    [[1, 1], [2, .28], [3, .09], [4.2, .03]].forEach(([m, a]) => partial(ctx, dest, 1320 * m, t0, m === 1 ? 2.4 : 1.6 / m + .5, v * a / 1.4, .006));
  } else {
    [[880, 0], [587, .3]].forEach(([f, d]) => partial(ctx, dest, f, t0 + d, .6, v * .8, .02));
  }
}
function playSound(kind, vol) {
  try {
    ac = ac || new AC();
    if (ac.state === 'suspended') ac.resume();

  ["용기는 삶이 평화를 허락하는 대가다.", "어밀리아 에어하트"],
  ["우리 모두에게는 꿈이 있다. 그러나 꿈을 현실로 만들려면 엄청난 결단력과 헌신, 자기 절제, 그리고 노력이 필요하다.", "제시 오언스"]
];
let qBag = [], qLast = -1;
function newQuote() {
  if (!qBag.length) {
    qBag = QUOTES.map((_, i) => i);
    for (let i = qBag.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [qBag[i], qBag[j]] = [qBag[j], qBag[i]]; }
    if (qBag[qBag.length - 1] === qLast && qBag.length > 1) [qBag[0], qBag[qBag.length - 1]] = [qBag[qBag.length - 1], qBag[0]];
  }
  qLast = qBag.pop();
  $('qText').textContent = QUOTES[qLast][0]; $('qBy').textContent = '— ' + QUOTES[qLast][1];
}
newQuote();

/* ---------- 테마 ---------- */
const SUN = '<svg viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zM11 1h2v3h-2zM11 20h2v3h-2zM1 11h3v2H1zM20 11h3v2h-3zM4.2 5.6l1.4-1.4 2.1 2.1-1.4 1.4zM16.3 17.7l1.4-1.4 2.1 2.1-1.4 1.4zM17.7 4.2l1.4 1.4-2.1 2.1-1.4-1.4zM5.6 19.8l-1.4-1.4 2.1-2.1 1.4 1.4z"/></svg>';
const MOON = '<svg viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
function applyTheme() {
  const dark = cfg.theme === 'dark';
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('themeBtn').innerHTML = dark ? SUN : MOON;
  $('themeBtn').title = dark ? '라이트 테마로 전환' : '다크 테마로 전환';
  $('themeBtn').setAttribute('aria-label', $('themeBtn').title);
  const m = document.querySelector('meta[name=theme-color]'); if (m) m.content = dark ? '#0d0f14' : '#f3f4f8';
}
$('themeBtn').onclick = () => { cfg.theme = cfg.theme === 'dark' ? 'light' : 'dark'; sv('pomo-cfg', cfg); applyTheme(); };
applyTheme();

let toastTimer;
function toast(msg) {
  $('toast').textContent = msg; $('toast').classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4000);
}

function go(natural) {
  const n = nextPhase();
  if (s.phase === 'focus') { if (natural) s.stat.cycles++; s.cycle = n === 'long' ? 0 : s.cycle + 1; }
  s.phase = n; s.remaining = total(n);
  s.running = natural && cfg.auto; s.last = Date.now();
  render(); persistStat();
}

function tick() {
  if (!s.running) return;
  const now = Date.now(), dt = (now - s.last) / 1000; s.last = now;
  s.stat[s.phase === 'focus' ? 'focus' : 'rest'] += Math.min(dt, s.remaining);
  s.remaining -= dt;
  if (s.remaining <= 0) {
    const done = s.phase;
    go(true);
    beep(s.phase); window.focus();
    toast(done === 'focus' ? `집중 완료! ${NAMES[s.phase]} 시간이에요` : '휴식 끝! 다시 집중해 볼까요?');
  } else render();
  if (Math.floor(now / 1000) % 5 === 0) persistStat();
}
const persistStat = () => sv('pomo-stat', s.stat);
setInterval(tick, 250);
window.addEventListener('beforeunload', () => { tick(); persistStat(); });

function toggle() { tick(); s.running = !s.running; s.last = Date.now(); render(); }
$('start').onclick = toggle;
$('skip').onclick = () => { tick(); go(false); };
$('reset').onclick = () => { s.running = false; s.remaining = total(s.phase); render(); };
addEventListener('keydown', e => {
  if (e.code === 'Space' && !/INPUT|BUTTON/.test(document.activeElement.tagName) && !$('stats').open) { e.preventDefault(); toggle(); }
});

/* ---------- 세션 종료 ---------- */
$('end').onclick = () => {
  tick(); s.running = false; render();
  const f = s.stat.focus, r = s.stat.rest, sum = f + r || 1;
  $('sFocus').textContent = dur(f); $('sRest').textContent = dur(r);
  $('spF').style.width = f / sum * 100 + '%'; $('spR').style.width = r / sum * 100 + '%';
  $('sCycles').textContent = s.stat.cycles + '회';
  $('sTasks').textContent = `${tasks.filter(t => t.done).length} / ${tasks.length}`;
  $('stats').showModal();
};
$('keep').onclick = () => $('stats').close();
$('fresh').onclick = () => {
  $('stats').close();
  s.stat = {focus:0, rest:0, cycles:0}; s.phase = 'focus'; s.cycle = 0; s.remaining = total('focus');
  persistStat(); render();
};

/* ---------- 설정 ---------- */
const FIELDS = [['focus','집중 시간','분',1,180], ['short','짧은 휴식','분',1,60], ['long','긴 휴식','분',1,120], ['cycles','긴 휴식까지 사이클','회',1,12]];
$('settings').innerHTML = FIELDS.map(([k, label, unit]) =>
  `<div class="row"><span>${label}</span><div class="step"><button data-k="${k}" data-d="-1">−</button><input type="number" id="f-${k}" data-k="${k}"><em>${unit}</em><button data-k="${k}" data-d="1">+</button></div></div>`).join('');

function setCfg(k, v) {
  const [, , , lo, hi] = FIELDS.find(f => f[0] === k);
  const untouched = !s.running && s.remaining === total(s.phase);
  cfg[k] = Math.min(hi, Math.max(lo, Math.round(+v) || cfg[k]));
  $('f-' + k).value = cfg[k]; sv('pomo-cfg', cfg);
  if (untouched && k === s.phase) s.remaining = total(s.phase);
  render();
}
FIELDS.forEach(([k]) => $('f-' + k).value = cfg[k]);
$('settings').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setCfg(b.dataset.k, cfg[b.dataset.k] + +b.dataset.d); });
$('settings').addEventListener('change', e => setCfg(e.target.dataset.k, e.target.value));
const setVol = v => { cfg.volume = +v; $('volv').textContent = cfg.volume + '%'; sv('pomo-cfg', cfg); };
$('vol').value = cfg.volume; $('volv').textContent = cfg.volume + '%';
$('vol').oninput = e => setVol(e.target.value);
$('vol').onchange = () => playSound('focus', cfg.volume);
$('tf').onclick = () => playSound('focus', cfg.volume);
$('tr').onclick = () => playSound('rest', cfg.volume);
for (const k of ['auto', 'sound']) { $(k).checked = cfg[k]; $(k).onchange = () => { cfg[k] = $(k).checked; sv('pomo-cfg', cfg); }; }

/* ---------- 플래너 ---------- */
function renderTasks() {
  const ul = $('tasks'); ul.innerHTML = '';
  const done = tasks.filter(t => t.done).length;
  $('cnt').textContent = tasks.length ? `${done} / ${tasks.length} 완료` : '';
  $('tbar').style.width = tasks.length ? done / tasks.length * 100 + '%' : '0';
  if (!tasks.length) { ul.innerHTML = '<div class="empty">아직 할 일이 없어요.<br>오늘의 목표를 적어 보세요.</div>'; return; }
  tasks.forEach((t, i) => {
    const li = document.createElement('li'); li.className = t.done ? 'done' : '';
    const c = document.createElement('button'); c.className = 'chk'; c.setAttribute('role', 'checkbox'); c.setAttribute('aria-checked', t.done);
    c.innerHTML = '<svg viewBox="0 0 24 24"><path d="M5 12l5 5 9-10"/></svg>';
    c.onclick = () => { t.done = !t.done; sv('pomo-tasks', tasks); renderTasks(); };
    const sp = document.createElement('span'); sp.textContent = t.text;
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.title = '삭제';
    x.onclick = () => { tasks.splice(i, 1); sv('pomo-tasks', tasks); renderTasks(); };
    li.append(c, sp, x); ul.append(li);
  });
}
$('add').onsubmit = e => {
  e.preventDefault();
  const text = $('newTask').value.trim(); if (!text) return;
  tasks.push({text, done:false}); $('newTask').value = ''; sv('pomo-tasks', tasks); renderTasks();
};

renderTasks(); render();
</script>
</body>
</html>
